# Répétition du déploiement : seul « client » entre, par mot de passe ou par clé selon ce que le conteneur a reçu
# au démarrage (entree.sh). Lu avant le reste de sshd_config (Include en tête du fichier de Debian).
PermitRootLogin no
AllowUsers client
PasswordAuthentication yes
PermitEmptyPasswords no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
X11Forwarding no
AllowTcpForwarding no
PrintMotd no
# Chaque commande passe par ce script, qui la coupe dès que le client ferme son entrée, comme le serveur SSH des sites
# Node.js d'Infomaniak.
ForceCommand /usr/local/bin/commande-infomaniak.sh
