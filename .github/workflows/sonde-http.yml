name: Sonde HTTP

# Sonde jetable (branche claude/sonde-http, jamais fusionnée) : des requêtes du jeu reçoivent par moments un 404
# sans en-tête CORS du vrai serveur. Chaque requête part ici sur une connexion neuve, pour voir qui répond.
# Rien n'est créé sur le serveur (session et jeton inventés). Aucun secret.
on:
  push:
    branches: [claude/sonde-http]

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sonde
        run: |
          cat > sonde.mjs <<'EOF'
          import https from 'node:https';
          import { randomBytes } from 'node:crypto';
          const HOST = 'earthlife.needhelpapp.com';
          const ORIGIN = 'https://macgama.github.io';
          const skip = new Set(['date', 'strict-transport-security', 'x-content-type-options', 'cache-control', 'vary']);
          function req(method, path, body) {
            return new Promise((resolve) => {
              const t0 = performance.now();
              const headers = { Origin: ORIGIN };
              if (body !== undefined) { headers['Content-Type'] = 'text/plain;charset=UTF-8'; headers['Content-Length'] = Buffer.byteLength(body); }
              const r = https.request({ host: HOST, path, method, headers, agent: false }, (res) => {
                let text = '';
                res.on('data', (c) => { text += c; });
                res.on('end', () => {
                  const h = {};
                  for (const [k, v] of Object.entries(res.headers)) if (!skip.has(k)) h[k] = v;
                  resolve({ status: res.statusCode, ip: res.socket?.remoteAddress, ms: Math.round(performance.now() - t0), h, text });
                });
              });
              r.on('error', (e) => resolve({ status: 'erreur ' + (e.code ?? e.name) }));
              if (body !== undefined) r.write(body);
              r.end();
            });
          }
          const tally = {};
          async function run(label, method, path, body, n, gapMs = 300) {
            for (let i = 1; i <= n; i++) {
              const r = await req(method, path, typeof body === 'function' ? body() : body);
              const key = `${label} ${r.status} cors=${r.h?.['access-control-allow-origin'] ? 'oui' : 'non'}`;
              tally[key] = (tally[key] ?? 0) + 1;
              console.log(`${label} #${i} -> ${r.status} ${r.ms ?? ''} ms ip=${r.ip ?? '?'} ${JSON.stringify(r.h ?? {})} ${JSON.stringify((r.text ?? '').slice(0, 160))}`);
              await new Promise((s) => setTimeout(s, gapMs));
            }
          }
          const ses = () => JSON.stringify({ v: 1, ses: randomBytes(32).toString('base64url') });
          await run('santé', 'GET', '/v1/health', undefined, 12);
          await run('compte', 'POST', '/v1/account/me', ses, 20);
          await run('me', 'POST', '/v1/me', JSON.stringify({ v: 1, tok: 'x'.repeat(43), op: 'erase' }), 10);
          await run('racine', 'GET', '/', undefined, 6);
          console.log('\nBilan', JSON.stringify(tally, null, 1));
          EOF
          node sonde.mjs
