name: Sonde HTTP

# Sonde jetable (branche claude/sonde-http, jamais fusionnée) : des requêtes du jeu reçoivent par moments un 404
# sans en-tête CORS du vrai serveur. Hypothèse : après plus de 5 s de silence (keepAliveTimeout de Node), le proxy
# d'Infomaniak réutilise une connexion que Node a fermée, et ne rejoue pas un POST.
# Rien n'est créé sur le serveur (session et jeton inventés). Aucun secret.
on:
  push:
    branches: [claude/sonde-http]

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sonde
        run: |
          cat > sonde.mjs <<'EOF'
          import https from 'node:https';
          import { randomBytes } from 'node:crypto';
          const HOST = 'earthlife.needhelpapp.com';
          const ORIGIN = 'https://macgama.github.io';
          const skip = new Set(['date', 'strict-transport-security', 'x-content-type-options', 'cache-control', 'vary']);
          function req(method, path, body) {
            return new Promise((resolve) => {
              const t0 = performance.now();
              const headers = { Origin: ORIGIN };
              if (body !== undefined) { headers['Content-Type'] = 'text/plain;charset=UTF-8'; headers['Content-Length'] = Buffer.byteLength(body); }
              const r = https.request({ host: HOST, path, method, headers, agent: false }, (res) => {
                let text = '';
                res.on('data', (c) => { text += c; });
                res.on('end', () => {
                  const h = {};
                  for (const [k, v] of Object.entries(res.headers)) if (!skip.has(k)) h[k] = v;
                  resolve({ status: res.statusCode, ip: res.socket?.remoteAddress, ms: Math.round(performance.now() - t0), h, text });
                });
              });
              r.on('error', (e) => resolve({ status: 'erreur ' + (e.code ?? e.name) }));
              if (body !== undefined) r.write(body);
              r.end();
            });
          }
          const ses = () => JSON.stringify({ v: 1, ses: randomBytes(32).toString('base64url') });
          const sleep = (ms) => new Promise((s) => setTimeout(s, ms));
          const show = (label, r) => {
            const cors = !!r.h?.['access-control-allow-origin'];
            const bad = !(r.status === 401 || r.status === 200) || !cors;
            console.log(`${label} -> ${r.status} cors=${cors ? 'oui' : 'non'} ${r.ms ?? ''} ms` + (bad ? ` ${JSON.stringify(r.h ?? {})} ${JSON.stringify((r.text ?? '').slice(0, 300))}` : ''));
          };
          // Une requête, puis un silence de N s, puis un POST (et un GET après certains silences).
          show('départ POST', await req('POST', '/v1/account/me', ses()));
          for (const gap of [2, 7, 3, 8, 4, 10, 6, 5.5, 4.5]) {
            await sleep(gap * 1000);
            show(`après ${gap} s de silence, POST`, await req('POST', '/v1/account/me', ses()));
            show(`  aussitôt après, POST`, await req('POST', '/v1/account/me', ses()));
          }
          await sleep(8000);
          show('après 8 s de silence, GET santé', await req('GET', '/v1/health'));
          show('  aussitôt après, POST', await req('POST', '/v1/account/me', ses()));
          EOF
          node sonde.mjs
