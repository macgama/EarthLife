name: Sonde HTTP

# Sonde jetable (branche claude/sonde-http, jamais fusionnée) : des requêtes du jeu reçoivent par moments un 404
# sans en-tête CORS du vrai serveur. Silences seuls : sans effet (sonde précédente). Ici : connexion du client
# réutilisée après un silence, et requêtes juste après des WebSocket. Identités de test effacées à la fin.
# Rien n'est créé sur le serveur (session et jeton inventés). Aucun secret.
on:
  push:
    branches: [claude/sonde-http]

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sonde
        run: |
          npm i --silent --no-save ws@8 >/dev/null 2>&1
          cat > sonde.mjs <<'EOF'
          import https from 'node:https';
          import { randomBytes } from 'node:crypto';
          import { WebSocket } from 'ws';
          const HOST = 'earthlife.needhelpapp.com';
          const ORIGIN = 'https://macgama.github.io';
          const sleep = (ms) => new Promise((s) => setTimeout(s, ms));
          function req(method, path, body, agent = false) {
            return new Promise((resolve) => {
              const t0 = performance.now();
              const headers = { Origin: ORIGIN };
              if (body !== undefined) { headers['Content-Type'] = 'text/plain;charset=UTF-8'; headers['Content-Length'] = Buffer.byteLength(body); }
              const r = https.request({ host: HOST, path, method, headers, agent }, (res) => {
                let text = '';
                res.on('data', (c) => { text += c; });
                res.on('end', () => resolve({ status: res.statusCode, port: res.socket?.localPort, ms: Math.round(performance.now() - t0), h: res.headers, text }));
              });
              r.on('error', (e) => resolve({ status: 'erreur ' + (e.code ?? e.name) }));
              if (body !== undefined) r.write(body);
              r.end();
            });
          }
          // Qui répond (connexion neuve, GET /) : o = notre serveur, X = un autre (Express), ! = erreur réseau.
          let firstOther = null;
          async function who() {
            const r = await req('GET', '/');
            if (typeof r.status !== 'number') return '!';
            if (r.text === 'EarthLife : serveur du jeu à plusieurs.\n') return 'o';
            if (!firstOther) { const h = { ...r.h }; delete h.date; firstOther = `${r.status} ${JSON.stringify(h)} ${JSON.stringify(r.text.slice(0, 400))}`; }
            return 'X';
          }
          async function timeline(label, n, everyMs) {
            let line = '';
            for (let i = 0; i < n; i++) { line += await who(); await sleep(everyMs); }
            console.log(`${label} : ${line}`);
          }
          const toks = [];
          async function wsOpen() {
            const pair = [0, 1].map(() => new WebSocket(`wss://${HOST}/v1/ws`, { headers: { Origin: ORIGIN } }));
            await Promise.all(pair.map((w) => new Promise((r) => { w.on('open', r); w.on('error', r); })));
            for (const w of pair) {
              w.on('message', (d) => { try { const m = JSON.parse(String(d)); if (m.t === 'welcome' && m.tok) toks.push(m.tok); } catch {} });
              if (w.readyState === 1) w.send(JSON.stringify({ t: 'hello', v: 1, cl: 1, tok: null, c: 'dev' }));
            }
            await sleep(3000);
            return pair;
          }
          const closed = (pair) => Promise.all(pair.map((w) => new Promise((r) => { if (w.readyState === 3) r(); else w.on('close', r); })));
          await timeline('0 sans WebSocket, 20 requêtes à 0,5 s', 20, 500);
          let pair = await wsOpen();
          await timeline('C WebSocket ouvertes, 10 requêtes à 0,5 s', 10, 500);
          for (const w of pair) { w.send(JSON.stringify({ t: 'bye' })); w.close(); }
          await closed(pair);
          await timeline('A après bye et fermeture, 40 requêtes à 0,5 s', 40, 500);
          await sleep(20000);
          await timeline('A 20 s plus tard, 10 requêtes à 0,5 s', 10, 500);
          pair = await wsOpen();
          for (const w of pair) w.close();
          await closed(pair);
          await timeline('B après fermeture par le client sans bye, 30 requêtes à 0,5 s', 30, 500);
          console.log(`autre serveur, première réponse : ${firstOther ?? 'jamais vu'}`);
          let erased = 0;
          for (const tok of toks) { const r = await req('POST', '/v1/me', JSON.stringify({ v: 1, tok, op: 'erase' })); if (r.status === 200) erased++; }
          console.log(`identités de test : ${toks.length}, effacées : ${erased} (une réponse de l'autre serveur compte comme non effacée)`);
          EOF
          node sonde.mjs
