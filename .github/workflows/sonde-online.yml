# Sonde jetable (branche claude/sonde-online, jamais fusionnée) : la mise en place de la recette du jeu à plusieurs
# (ONLY=O4), huit fois en parallèle sur les machines de GitHub, avec le diagnostic des trames (DIAG=1).
name: Sonde en ligne
on:
  push:
    branches: [claude/sonde-online]
permissions:
  contents: read
jobs:
  mise-en-place:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: server
      - run: npm install --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node test/online-acceptance.mjs browser-shots/online
        env:
          ONLY: O4
          DIAG: '1'
