name: Prototype

# Teste le prototype 3D (tests unitaires et mesures de performance, puis tests d'acceptation hors ligne dans
# Chromium, jeu solo et jeu à plusieurs contre le faux serveur de server/), le vérifie contre les vraies données
# (OpenFreeMap, Open-Meteo) et le publie sur GitHub Pages via la branche gh-pages.
on:
  push:
    branches: [main, claude/prototype-3d-earthlife]
    paths: ['prototype/**', 'server/**', '.github/workflows/prototype.yml']
  pull_request:
    paths: ['prototype/**', 'server/**', '.github/workflows/prototype.yml']
  workflow_dispatch:

concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true

# Lecture seule pour tous les travaux, qui lancent du code tiers (Playwright, modules du serveur) : seul deploy écrit,
# sur la branche gh-pages.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # Mesures de performance de la base sous node (spec 9.3), 95e centile sur la fixture de Lyon.
      - run: npm run bench

  real-data:
    # Vraies tuiles OpenFreeMap et vraie météo : ce contrôle informe sans bloquer la publication.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node test/real-data-smoke.mjs lyon paris tokyo newyork reykjavik perouges

  acceptance:
    # Tests d'acceptation de la base dans Chromium, sans réseau (tuiles de Lyon et météo enregistrées dans
    # test/fixtures) : le jeu solo (spec 9.2 et 9.3). Ce contrôle bloque la publication. Il tourne en même temps que
    # acceptance-online, sur une autre machine : deux fois moins longtemps que les deux séries à la suite.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node test/base-acceptance.mjs browser-shots/acceptance
        env:
          ROUTES: test/fixtures/offline-routes.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-acceptation
          path: prototype/browser-shots/acceptance
          retention-days: 14

  acceptance-online:
    # Jeu à plusieurs (spec multijoueur 9.3, O1 à O27) dans Chromium, contre le faux serveur (server/dev.mjs, magasin
    # en mémoire, lancé dans le même processus), sans réseau. Ce contrôle bloque la publication.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Dépendances du faux serveur (ws, mysql2), sans script d'installation ; server/ demande Node 18 ou plus.
      - run: npm ci --ignore-scripts
        working-directory: server
      - run: npm install --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node test/online-acceptance.mjs browser-shots/online
        timeout-minutes: 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-en-ligne
          path: prototype/browser-shots/online
          retention-days: 14

  browser:
    # Vrai navigateur et vrais services (carte, recherche, tuiles, météo) : informe sans bloquer la publication.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node test/browser-smoke.mjs browser-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-navigateur
          path: prototype/browser-shots
          retention-days: 14

  deploy:
    needs: [test, acceptance, acceptance-online]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp prototype/index.html _site/
          # Page « Ce que le jeu garde » (lien de la carte « Jouer à plusieurs ») : sans elle, pas de publication.
          test -f prototype/confidentialite.html || { echo "prototype/confidentialite.html manquante" >&2; exit 1; }
          cp prototype/confidentialite.html _site/
          cp -r prototype/src _site/
          cp -r prototype/assets _site/
          # Empreinte du jeu publié (7 premiers caractères du commit), envoyée dans hello pour les mesures du serveur
          # (section 4.8) ; remplace la valeur de développement de src/net/build.js.
          mkdir -p _site/src/net
          echo "export const BUILD = '${GITHUB_SHA::7}';" > _site/src/net/build.js
          grep -Eq "^export const BUILD = '[0-9a-f]{7}';$" _site/src/net/build.js
          touch _site/.nojekyll
      - name: Publier sur la branche gh-pages
        # Action tierce qui écrit sur le dépôt : épinglée à un commit (v4.1.0), Dependabot propose les montées.
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          commit_message: 'Publie le prototype'
